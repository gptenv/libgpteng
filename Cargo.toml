[package]
name = "libgpteng"
version = "0.1.0"
edition = "2024"
description = "A cross-platform, scriptable 3D engine with an MCP control plane"
license = "MIT"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
glam = { version = "0.30", features = ["serde"] }
hecs = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"], optional = true }
base64 = "0.22"
gltf = { version = "1.4", default-features = false, features = ["utils"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "pnm"] }

[dependencies.wgpu]
version = "30"
features = ["webgl"]
optional = true

[dependencies.piccolo]
version = "0.3.3"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "HtmlCanvasElement", "console"] }

[features]
default = ["render-wgpu", "scripting-lua", "mcp"]
render-wgpu = ["dep:wgpu", "dep:bytemuck"]
scripting-lua = ["dep:piccolo"]
mcp = ["dep:rmcp", "dep:axum", "dep:tokio", "scripting-lua"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["net", "macros", "rt-multi-thread"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
